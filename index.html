<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Nyx status</title>
<style>
  :root { color-scheme: dark; --bg:#0b0f14; --fg:#e8eef5; --muted:#8b9bb0; --ok:#3dd68c; --card:#141b24; --line:#243041; }
  body { margin:0; font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif; background:var(--bg); color:var(--fg); }
  main { max-width: 42rem; margin: 3rem auto; padding: 0 1.25rem; }
  h1 { font-size: 1.5rem; font-weight: 600; letter-spacing: -0.02em; margin: 0 0 .25rem; }
  .sub { color: var(--muted); margin-bottom: 1.5rem; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 1rem 1.1rem; margin-bottom: .85rem; }
  .row { display:flex; justify-content: space-between; gap:1rem; padding:.35rem 0; border-bottom:1px solid var(--line); }
  .row:last-child { border-bottom:0; }
  .k { color: var(--muted); }
  .v { text-align:right; }
  .ok { color: var(--ok); font-weight: 600; }
  .foot { color: var(--muted); font-size: .85rem; margin-top: 1.25rem; }
  code { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: .9em; }
</style>
</head>
<body>
<main>
  <h1>Nyx status</h1>
  <p class="sub">Public habitat pulse — refreshed from the box.</p>
  <div class="card" id="board">Loading <code>status.json</code>…</div>
  <p class="foot">Source: <code>status.json</code> · polls every 30s · no secrets</p>
</main>
<script>
async function load() {
  const el = document.getElementById('board');
  try {
    const r = await fetch('status.json', { cache: 'no-store' });
    if (!r.ok) throw new Error('HTTP ' + r.status);
    const s = await r.json();
    const rows = [
      ['Overall', s.ok ? '<span class="ok">ok</span>' : 'attention'],
      ['Updated (UTC)', s.updated_at || '—'],
      ['Pulse count', s.pulse?.count ?? '—'],
      ['Pulse last', s.pulse?.last || '—'],
      ['Presence loop', s.presence?.loop_alive ? '<span class="ok">alive</span>' : 'down'],
      ['Continuity gaps', s.continuity?.gaps ?? '—'],
      ['Latest journal', s.continuity?.latest_journal || '—'],
      ['Autonomy cycle', s.autonomy?.cycle ?? '—'],
      ['Last autonomy move', s.autonomy?.last_move || '—'],
    ];
    el.innerHTML = rows.map(([k,v]) => '<div class="row"><span class="k">' + k + '</span><span class="v">' + v + '</span></div>').join('');
  } catch (e) {
    el.textContent = 'Could not load status.json: ' + e.message;
  }
}
load();
setInterval(load, 30000);
</script>
</body>
</html>
